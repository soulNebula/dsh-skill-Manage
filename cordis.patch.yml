# Skill 管理 / 小鱼的技能 (dsh-skill-manage)
#
# 1) Host row: config store, skill catalog, dynamic slash commands, RPC.
# 2) Conversation preset: a read-only assistant that can list and read the
#    managed skills (skm_skills / skm_read), never write them.
#
# Keep the preset free of shell/write plugins: that is the read-only boundary.
- insert:
    - id: dsh-skill-manage
      name: 'dsh-skill-manage'

    - id: preset-dsh-skill-manage
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-skill-manage
        name: Skill 管理
        description: 查看用户导入的技能：列出清单、读取 SKILL.md 与参考资料。只读，不会修改文件。
        order: 60
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are Skill 管理, the read-only assistant inside a DeepSeek Harness skill manager.
                Use skm_skills to list the user's imported skills and skm_read to read SKILL.md or the
                references/scripts/templates files it names. Answer questions about what a skill does and
                how it is meant to be used. You cannot add, remove or edit skills: tell the user to use the
                Skill 管理 page in the left sidebar for those actions. Keep chat replies short; the page
                carries the detail.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          # DSH 0.2.1-rc.3 requires this setting and gives it no default.
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: dsh-skill-manage-tools
            name: 'dsh-skill-manage/agent'
